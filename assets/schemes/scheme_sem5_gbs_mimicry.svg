<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" width="100%" height="auto" style="background:transparent; font-family:'IBM Plex Sans', -apple-system, sans-serif;">
  <defs>
    <marker id="arrow-gbs" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#8d8d8d"/>
    </marker>
  </defs>

  <!-- Box 1: Campylobacter O:19 -->
  <g transform="translate(20, 30)">
    <rect x="0" y="0" width="270" height="190" rx="6" fill="#262626" stroke="#3ddbd9" stroke-width="1.8"/>
    <text x="18" y="28" fill="#3ddbd9" font-size="12.5" font-weight="700">1. БАКТЕРИЯ C. jejuni</text>
    <text x="18" y="50" fill="#f4f4f4" font-size="11.5">Серотип Пеннера O:19 / O:4</text>
    <text x="18" y="76" fill="#c6c6c6" font-size="11">На наружной мембране несет</text>
    <text x="18" y="93" fill="#c6c6c6" font-size="11">липоолигосахарид (ЛОС)</text>
    <rect x="18" y="115" width="234" height="55" rx="4" fill="#161616" stroke="#3ddbd9"/>
    <text x="135" y="138" text-anchor="middle" fill="#3ddbd9" font-size="11.5" font-weight="700">Тетрасахаридная «метка»</text>
    <text x="135" y="156" text-anchor="middle" fill="#f1c21b" font-size="11">Идентична ганглиозиду GM1</text>
  </g>

  <line x1="290" y1="125" x2="335" y2="125" stroke="#8d8d8d" stroke-width="2" marker-end="url(#arrow-gbs)"/>

  <!-- Box 2: Immune Response -->
  <g transform="translate(340, 30)">
    <rect x="0" y="0" width="270" height="190" rx="6" fill="#262626" stroke="#0f62fe" stroke-width="1.8"/>
    <text x="18" y="28" fill="#78a9ff" font-size="12.5" font-weight="700">2. ИММУННЫЙ ОТВЕТ</text>
    <text x="18" y="50" fill="#f4f4f4" font-size="11.5">Через 1–3 недели после энтерита</text>
    <text x="18" y="76" fill="#c6c6c6" font-size="11">Иммунитет вырабатывает</text>
    <text x="18" y="93" fill="#c6c6c6" font-size="11">антитела к метке бактерии</text>
    <rect x="18" y="115" width="234" height="55" rx="4" fill="#161616" stroke="#0f62fe"/>
    <text x="135" y="138" text-anchor="middle" fill="#78a9ff" font-size="11.5" font-weight="700">Перекрестная реакция</text>
    <text x="135" y="156" text-anchor="middle" fill="#f4f4f4" font-size="11">«Дружественный огонь» антител</text>
  </g>

  <line x1="610" y1="125" x2="655" y2="125" stroke="#8d8d8d" stroke-width="2" marker-end="url(#arrow-gbs)"/>

  <!-- Box 3: Nerve Damage -->
  <g transform="translate(660, 30)">
    <rect x="0" y="0" width="280" height="190" rx="6" fill="#262626" stroke="#da1e28" stroke-width="1.8"/>
    <text x="18" y="28" fill="#ff8389" font-size="12.5" font-weight="700">3. АТАКА НА МИЕЛИН (СГБ)</text>
    <text x="18" y="50" fill="#f4f4f4" font-size="11.5">Синдром Гийена–Барре</text>
    <text x="18" y="76" fill="#c6c6c6" font-size="11">Антитела атакуют ганглиозид</text>
    <text x="18" y="93" fill="#c6c6c6" font-size="11">GM1 / GD1a оболочки нервов</text>
    <rect x="18" y="115" width="244" height="55" rx="4" fill="#161616" stroke="#da1e28"/>
    <text x="140" y="138" text-anchor="middle" fill="#ff8389" font-size="11.5" font-weight="700">Демиелинизация нервов</text>
    <text x="140" y="156" text-anchor="middle" fill="#f4f4f4" font-size="11">Восходящий паралич (1 : 2000)</text>
  </g>

  <!-- Bottom stat -->
  <rect x="20" y="242" width="920" height="54" rx="4" fill="#262626" stroke="#525252"/>
  <text x="480" y="266" text-anchor="middle" fill="#f4f4f4" font-size="12">
    Молекулярная мимикрия: 33–40% всех пациентов с синдромом Гийена–Барре ранее перенесли кампилобактериоз
  </text>
  <text x="480" y="285" text-anchor="middle" fill="#c6c6c6" font-size="11">
    Второе аутоиммунное осложнение после C. jejuni (и Salmonella) — реактивный артрит (~2% случаев)
  </text>
</svg>
