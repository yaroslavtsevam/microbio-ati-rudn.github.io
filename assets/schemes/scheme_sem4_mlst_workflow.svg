<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" width="100%" height="auto" style="background:#161616; border-radius:6px; font-family:'IBM Plex Sans', -apple-system, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#8d8d8d"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="50" fill="#262626" rx="6 6 0 0"/>
  <text x="25" y="32" fill="#f4f4f4" font-size="15" font-weight="600">МЕТОДОЛОГИЯ МУЛЬТИЛОКУСНОГО ТИПИРОВАНИЯ (MLST / MLSA)</text>
  <text x="750" y="32" fill="#8d8d8d" font-size="12">Разрешение внутривидовых штаммов</text>

  <!-- Step 1 -->
  <g transform="translate(40, 75)">
    <rect x="0" y="0" width="240" height="120" rx="4" fill="#262626" stroke="#0f62fe"/>
    <text x="15" y="24" fill="#78a9ff" font-size="12" font-weight="700">1. ГЕНЫ ДОМАШНЕГО ХОЗЯЙСТВА</text>
    <text x="15" y="44" fill="#c6c6c6" font-size="11">Выбор 7 консервативных генов:</text>
    <text x="15" y="62" fill="#f4f4f4" font-size="11">• recA (репарация ДНК)</text>
    <text x="15" y="78" fill="#f4f4f4" font-size="11">• gyrB (ДНК-гираза), rpoB (РНК-пол)</text>
    <text x="15" y="94" fill="#f4f4f4" font-size="11">• atpD, groEL, gapA, purA</text>
  </g>

  <line x1="280" y1="135" x2="320" y2="135" stroke="#8d8d8d" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 2 -->
  <g transform="translate(330, 75)">
    <rect x="0" y="0" width="260" height="120" rx="4" fill="#262626" stroke="#009d9a"/>
    <text x="15" y="24" fill="#3ddbd9" font-size="12" font-weight="700">2. ПЦР И СЕКВЕНИРОВАНИЕ</text>
    <text x="15" y="44" fill="#c6c6c6" font-size="11">Секвенирование фрагментов по Сэнгеру:</text>
    <text x="15" y="64" fill="#f4f4f4" font-size="11">Длина фрагментов: 450–500 п.н.</text>
    <text x="15" y="84" fill="#c6c6c6" font-size="11">Выявление синонимичных мутаций в 3-х позициях кодонов</text>
  </g>

  <line x1="590" y1="135" x2="630" y2="135" stroke="#8d8d8d" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 3 -->
  <g transform="translate(640, 75)">
    <rect x="0" y="0" width="280" height="120" rx="4" fill="#262626" stroke="#8a3ffc"/>
    <text x="15" y="24" fill="#be95ff" font-size="12" font-weight="700">3. АЛЛЕЛЬНЫЙ ПРОФИЛЬ (ST)</text>
    <text x="15" y="44" fill="#c6c6c6" font-size="11">Сопоставление с базой PubMLST:</text>
    <text x="15" y="64" fill="#f1c21b" font-family="'IBM Plex Mono', monospace" font-size="11">3 - 12 - 1 - 4 - 2 - 8 - 5</text>
    <text x="15" y="88" fill="#42be65" font-size="12" font-weight="700">ИТОГ: Сиквенс-тип ST-131</text>
    <text x="15" y="104" fill="#c6c6c6" font-size="10">(юридическое расследование вспышки)</text>
  </g>

  <!-- Bottom note -->
  <rect x="40" y="215" width="880" height="40" rx="4" fill="#262626" stroke="#525252"/>
  <text x="480" y="240" text-anchor="middle" fill="#d0e2ff" font-size="11">
    Дифференцирует E. coli vs Shigella и B. cereus vs B. anthracis, у которых 16S рРНК идентична на &gt; 99,5%!
  </text>
</svg>