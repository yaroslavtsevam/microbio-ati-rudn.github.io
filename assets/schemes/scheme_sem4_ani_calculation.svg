<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" width="100%" height="auto" style="background:#161616; border-radius:6px; font-family:'IBM Plex Sans', -apple-system, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#8d8d8d"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="50" fill="#262626" rx="6 6 0 0"/>
  <text x="25" y="32" fill="#f4f4f4" font-size="15" font-weight="600">РАСЧЕТ СРЕДНЕЙ НУКЛЕОТИДНОЙ ИДЕНТИЧНОСТИ (ANI) IN SILICO</text>
  <text x="740" y="32" fill="#8d8d8d" font-size="12">Замена ДНК-ДНК гибридизации (DDH)</text>

  <!-- Box 1: Genomes -->
  <g transform="translate(40, 75)">
    <rect x="0" y="0" width="260" height="110" rx="4" fill="#262626" stroke="#0f62fe"/>
    <text x="15" y="24" fill="#78a9ff" font-size="12" font-weight="700">1. СРАВНИВАЕМЫЕ ГЕНОМЫ (WGS)</text>
    <text x="15" y="46" fill="#f4f4f4" font-size="11">Геном А: заводской изолят</text>
    <text x="15" y="64" fill="#f4f4f4" font-size="11">Геном Б: типовой музейный штамм</text>
    <text x="15" y="86" fill="#c6c6c6" font-size="10">Нарезка генома А на отрезки по 1020 п.н.</text>
  </g>

  <line x1="300" y1="130" x2="340" y2="130" stroke="#8d8d8d" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Box 2: BLAST Alignment -->
  <g transform="translate(350, 75)">
    <rect x="0" y="0" width="280" height="110" rx="4" fill="#262626" stroke="#009d9a"/>
    <text x="15" y="24" fill="#3ddbd9" font-size="12" font-weight="700">2. ПАРНОЕ ВЫРАВНИВАНИЕ (BLASTN)</text>
    <text x="15" y="46" fill="#f4f4f4" font-size="11">Поиск двусторонних ортологов (BBH):</text>
    <text x="15" y="64" fill="#c6c6c6" font-size="11">• Сходство отрезка &gt; 70%</text>
    <text x="15" y="82" fill="#c6c6c6" font-size="11">• Покрытие длины не менее 70%</text>
  </g>

  <line x1="630" y1="130" x2="670" y2="130" stroke="#8d8d8d" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Box 3: ANI Score & Decision -->
  <g transform="translate(680, 75)">
    <rect x="0" y="0" width="240" height="110" rx="4" fill="#262626" stroke="#8a3ffc"/>
    <text x="15" y="24" fill="#be95ff" font-size="12" font-weight="700">3. ПОРОГ ДЕМАРКАЦИИ ВИДА</text>
    <text x="15" y="48" fill="#42be65" font-size="12" font-weight="700">ANI ≥ 95–96%</text>
    <text x="15" y="66" fill="#c6c6c6" font-size="11">Один биологический вид</text>
    <text x="15" y="86" fill="#ff8389" font-size="11">ANI &lt; 95% — разные виды</text>
  </g>

  <!-- Formula -->
  <rect x="40" y="205" width="880" height="55" rx="4" fill="#262626" stroke="#525252"/>
  <text x="480" y="228" text-anchor="middle" fill="#f1c21b" font-family="'IBM Plex Mono', monospace" font-size="13">
    ANI = (Σ % идентичности всех общих ортологов) / N
  </text>
  <text x="480" y="246" text-anchor="middle" fill="#c6c6c6" font-size="11">
    Строгая математическая корреляция с классическим эмпирическим критерием DDH ≥ 70%
  </text>
</svg>