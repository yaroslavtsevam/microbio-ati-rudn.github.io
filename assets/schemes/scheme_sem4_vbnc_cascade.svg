<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="100%" height="auto" style="background:#161616; border-radius:6px; font-family:'IBM Plex Sans', -apple-system, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#8d8d8d"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="50" fill="#262626" rx="6 6 0 0"/>
  <text x="25" y="32" fill="#f4f4f4" font-size="15" font-weight="600">КАСКАД ПЕРЕХОДА ПИЩЕВЫХ ПАТОГЕНОВ В СОСТОЯНИЕ VBNC (Viable But Non-Culturable)</text>
  <text x="750" y="32" fill="#8d8d8d" font-size="12">Campylobacter, Listeria, Salmonella</text>

  <!-- Step 1: Stress factors -->
  <g transform="translate(60, 75)">
    <rect x="0" y="0" width="840" height="55" rx="4" fill="#262626" stroke="#da1e28" stroke-width="1.5"/>
    <text x="20" y="24" fill="#ff8389" font-size="12" font-weight="700">ТЕХНОЛОГИЧЕСКИЙ СТРЕСС В ПИЩЕВОМ ЦЕХЕ:</text>
    <text x="20" y="42" fill="#f4f4f4" font-size="12">Шоковое охлаждение тушек (+2...+4 °C) • Дезинфектанты (хлор, ЧАС) • Низкая активность воды aw &lt; 0.60 • Высокая кислотность (pH &lt; 4.5)</text>
  </g>

  <line x1="480" y1="130" x2="480" y2="160" stroke="#8d8d8d" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 2: Biological adaptations -->
  <g transform="translate(60, 165)">
    <rect x="0" y="0" width="840" height="95" rx="4" fill="#262626" stroke="#0f62fe" stroke-width="1.5"/>
    <text x="20" y="24" fill="#78a9ff" font-size="13" font-weight="700">ЦИТОЛОГИЧЕСКИЙ ОТВЕТ КЛЕТКИ (ПЕРЕХОД В VBNC):</text>
    <text x="20" y="46" fill="#c6c6c6" font-size="12">1. Дварфизм: палочка сжимается в мелкий кокк (объем уменьшается в 2–4 раза)</text>
    <text x="20" y="64" fill="#c6c6c6" font-size="12">2. Уплотнение стенки: увеличение поперечных сшивок пептидогликана</text>
    <text x="20" y="82" fill="#c6c6c6" font-size="12">3. Мембрана: синтез циклопропановых жирных кислот; метаболический шатдаун (транскрипция &lt; 2%) при сохранении пула АТФ</text>
  </g>

  <!-- Branches -->
  <path d="M 320 260 L 320 300" stroke="#8d8d8d" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 640 260 L 640 300" stroke="#8d8d8d" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Branch Left: Routine analysis failure -->
  <g transform="translate(60, 305)">
    <rect x="0" y="0" width="400" height="95" rx="4" fill="#262626" stroke="#f1c21b" stroke-width="1.5"/>
    <text x="15" y="24" fill="#f1c21b" font-size="12" font-weight="700">АНАЛИЗ ПО ГОСТ / ТР ТС 021 (ЧАШКИ ПЕТРИ):</text>
    <text x="15" y="44" fill="#f4f4f4" font-size="12">• Высев на селективный агар: 0 колоний!</text>
    <text x="15" y="62" fill="#ff8389" font-size="12">• Заключение: «Брак отсутствует, партия годна»</text>
    <text x="15" y="82" fill="#f1c21b" font-size="11" font-weight="600">[ЛОЖНОЕ СПОКОЙСТВИЕ И СКРЫТЫЙ РИСК]</text>
  </g>

  <!-- Branch Right: Human infection -->
  <g transform="translate(500, 305)">
    <rect x="0" y="0" width="400" height="95" rx="4" fill="#262626" stroke="#da1e28" stroke-width="1.5"/>
    <text x="15" y="24" fill="#ff8389" font-size="12" font-weight="700">ПОПАДАНИЕ В ЖКТ ЧЕЛОВЕКА (+37 °C):</text>
    <text x="15" y="44" fill="#f4f4f4" font-size="12">• Реверсия (Resuscitation) за 2–4 часа под действием желчи</text>
    <text x="15" y="62" fill="#f4f4f4" font-size="12">• Восстановление жгутиков и экспрессия энтеротоксинов</text>
    <text x="15" y="82" fill="#da1e28" font-size="11" font-weight="700">[ВСПЫШКА ТОКСИКОИНФЕКЦИИ И ЛИСТЕРИОЗА]</text>
  </g>
</svg>