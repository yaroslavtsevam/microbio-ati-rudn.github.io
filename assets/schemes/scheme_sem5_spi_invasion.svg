<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" width="100%" height="auto" style="background:transparent; font-family:'IBM Plex Sans', -apple-system, sans-serif;">
  <defs>
    <marker id="arrow-spi" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#8d8d8d"/>
    </marker>
  </defs>

  <!-- Step 1 -->
  <g transform="translate(20, 30)">
    <rect x="0" y="0" width="210" height="220" rx="6" fill="#262626" stroke="#0f62fe" stroke-width="1.8"/>
    <text x="15" y="26" fill="#78a9ff" font-size="12.5" font-weight="700">1. ПРИКРЕПЛЕНИЕ</text>
    <text x="15" y="48" fill="#f4f4f4" font-size="11.5">Подвздошная кишка (ileum)</text>
    <text x="15" y="68" fill="#c6c6c6" font-size="11">• Переживает кислоту (ATR)</text>
    <text x="15" y="86" fill="#c6c6c6" font-size="11">• Фимбрии крепятся</text>
    <text x="15" y="102" fill="#c6c6c6" font-size="11">  к М-клеткам пейеровых</text>
    <text x="15" y="118" fill="#c6c6c6" font-size="11">  бляшек</text>
    <rect x="15" y="145" width="180" height="55" rx="4" fill="#161616" stroke="#393939"/>
    <text x="105" y="168" text-anchor="middle" fill="#f1c21b" font-size="11" font-weight="600">Жиры (шоколад, сыр)</text>
    <text x="105" y="186" text-anchor="middle" fill="#c6c6c6" font-size="10.5">снижают дозу до 1–100 кл.</text>
  </g>

  <line x1="230" y1="140" x2="258" y2="140" stroke="#8d8d8d" stroke-width="2" marker-end="url(#arrow-spi)"/>

  <!-- Step 2 -->
  <g transform="translate(262, 30)">
    <rect x="0" y="0" width="210" height="220" rx="6" fill="#262626" stroke="#ff8389" stroke-width="1.8"/>
    <text x="15" y="26" fill="#ff8389" font-size="12.5" font-weight="700">2. «ШПРИЦ» SPI-1</text>
    <text x="15" y="48" fill="#f4f4f4" font-size="11.5">Система секреции III типа</text>
    <text x="15" y="68" fill="#c6c6c6" font-size="11">• Впрыск эффекторов T3SS</text>
    <text x="15" y="86" fill="#c6c6c6" font-size="11">  в цитоплазму энтероцита</text>
    <text x="15" y="104" fill="#c6c6c6" font-size="11">• Перестройка актина</text>
    <text x="15" y="122" fill="#c6c6c6" font-size="10.5">• «Взъерошивание» (ruffling)</text>
    <rect x="15" y="145" width="180" height="55" rx="4" fill="#161616" stroke="#da1e28"/>
    <text x="105" y="168" text-anchor="middle" fill="#ff8389" font-size="11" font-weight="600">Макропиноцитоз</text>
    <text x="105" y="186" text-anchor="middle" fill="#c6c6c6" font-size="10">клетка сама «глотает» микроб</text>
  </g>

  <line x1="472" y1="140" x2="500" y2="140" stroke="#8d8d8d" stroke-width="2" marker-end="url(#arrow-spi)"/>

  <!-- Step 3 -->
  <g transform="translate(504, 30)">
    <rect x="0" y="0" width="210" height="220" rx="6" fill="#262626" stroke="#be95ff" stroke-width="1.8"/>
    <text x="15" y="26" fill="#be95ff" font-size="12.5" font-weight="700">3. БЛОКАДА SPI-2</text>
    <text x="15" y="48" fill="#f4f4f4" font-size="11.5">Выживание в вакуоли</text>
    <text x="15" y="68" fill="#c6c6c6" font-size="11">• Секреция белка SpiC</text>
    <text x="15" y="86" fill="#c6c6c6" font-size="11">• Запрет слияния</text>
    <text x="15" y="102" fill="#c6c6c6" font-size="11">  фагосомы с лизосомой</text>
    <text x="15" y="120" fill="#c6c6c6" font-size="11">• Размножение внутри клетки</text>
    <rect x="15" y="145" width="180" height="55" rx="4" fill="#161616" stroke="#8a3ffc"/>
    <text x="105" y="168" text-anchor="middle" fill="#be95ff" font-size="11" font-weight="600">Апоптоз макрофагов</text>
    <text x="105" y="186" text-anchor="middle" fill="#c6c6c6" font-size="10.5">выход в lamina propria</text>
  </g>

  <line x1="714" y1="140" x2="742" y2="140" stroke="#8d8d8d" stroke-width="2" marker-end="url(#arrow-spi)"/>

  <!-- Step 4 -->
  <g transform="translate(746, 30)">
    <rect x="0" y="0" width="194" height="220" rx="6" fill="#262626" stroke="#42be65" stroke-width="1.8"/>
    <text x="15" y="26" fill="#42be65" font-size="12.5" font-weight="700">4. ВОСПАЛЕНИЕ</text>
    <text x="15" y="48" fill="#f4f4f4" font-size="11.5">Клиника гастроэнтерита</text>
    <text x="15" y="68" fill="#c6c6c6" font-size="11">• Выброс IL-8 и приток</text>
    <text x="15" y="84" fill="#c6c6c6" font-size="11">  нейтрофилов</text>
    <text x="15" y="102" fill="#c6c6c6" font-size="11">• Простагландины →</text>
    <text x="15" y="118" fill="#c6c6c6" font-size="11">  аденилатциклаза</text>
    <rect x="15" y="145" width="164" height="55" rx="4" fill="#161616" stroke="#24a148"/>
    <text x="97" y="168" text-anchor="middle" fill="#42be65" font-size="11" font-weight="600">Сброс воды в кишку</text>
    <text x="97" y="186" text-anchor="middle" fill="#c6c6c6" font-size="10.5">инкубация 6–72 ч, 2–7 сут</text>
  </g>

  <!-- Bottom note -->
  <rect x="20" y="272" width="920" height="48" rx="4" fill="#262626" stroke="#525252"/>
  <text x="480" y="301" text-anchor="middle" fill="#f4f4f4" font-size="12">
    Островки патогенности SPI-1 и SPI-2 (35–40 тыс. п.н.) приобретены Salmonella путем горизонтального переноса генов (HGT)
  </text>
</svg>
