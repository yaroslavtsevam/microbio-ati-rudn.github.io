<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 215" width="100%" height="auto" style="background:transparent; font-family:'IBM Plex Sans', -apple-system, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- Stage 1 -->
  <g transform="translate(30, 15)">
    <rect x="0" y="0" width="200" height="130" rx="4" fill="#edf5ff" stroke="#0f62fe" stroke-width="1.8"/>
    <text x="15" y="25" fill="#0043ce" font-size="12" font-weight="700">1. ГИДРОЛИЗ</text>
    <text x="15" y="45" fill="#475569" font-size="10.5" font-style="italic">Clostridium, Bacillus</text>
    <text x="15" y="70" fill="#0f172a" font-size="11" font-weight="600">Белки, жиры, крахмал</text>
    <text x="15" y="90" fill="#b45309" font-size="11" font-weight="700">↓ внеклеточные гидролазы</text>
    <text x="15" y="110" fill="#334155" font-size="11">Аминокислоты, сахара</text>
  </g>

  <line x1="230" y1="80" x2="260" y2="80" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Stage 2 -->
  <g transform="translate(265, 15)">
    <rect x="0" y="0" width="200" height="130" rx="4" fill="#f0fdfa" stroke="#007d79" stroke-width="1.8"/>
    <text x="15" y="25" fill="#005d5d" font-size="12" font-weight="700">2. АЦИДОГЕНЕЗ</text>
    <text x="15" y="45" fill="#475569" font-size="10.5" font-style="italic">LAB, Enterobacter</text>
    <text x="15" y="70" fill="#0f172a" font-size="11" font-weight="600">Сбраживание мономеров</text>
    <text x="15" y="90" fill="#b45309" font-size="11" font-weight="700">↓ анаэробное брожение</text>
    <text x="15" y="110" fill="#334155" font-size="11">Лактат, бутират, спирты</text>
  </g>

  <line x1="465" y1="80" x2="495" y2="80" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Stage 3 -->
  <g transform="translate(500, 15)">
    <rect x="0" y="0" width="200" height="130" rx="4" fill="#f5f3ff" stroke="#6929c4" stroke-width="1.8"/>
    <text x="15" y="25" fill="#6929c4" font-size="12" font-weight="700">3. АЦЕТОГЕНЕЗ</text>
    <text x="15" y="45" fill="#475569" font-size="10.5" font-style="italic">Syntrophobacter</text>
    <text x="15" y="70" fill="#0f172a" font-size="11" font-weight="600">Окисление жирных кислот</text>
    <text x="15" y="90" fill="#b45309" font-size="11" font-weight="700">↓ синтрофный перенос H₂</text>
    <text x="15" y="110" fill="#334155" font-size="11">Ацетат + H₂ + CO₂</text>
  </g>

  <line x1="700" y1="80" x2="730" y2="80" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Stage 4 -->
  <g transform="translate(735, 15)">
    <rect x="0" y="0" width="195" height="130" rx="4" fill="#fdf2f8" stroke="#d02670" stroke-width="1.8"/>
    <text x="15" y="25" fill="#9f1853" font-size="12" font-weight="700">4. МЕТАНОГЕНЕЗ</text>
    <text x="15" y="45" fill="#9f1853" font-size="10.5" font-weight="600">АРХЕИ Methanosaeta</text>
    <text x="15" y="70" fill="#047857" font-size="12" font-weight="700">БИОГАЗ:</text>
    <text x="15" y="90" fill="#0f172a" font-size="11" font-weight="600">• CH₄ (60–75%)</text>
    <text x="15" y="110" fill="#0f172a" font-size="11" font-weight="600">• CO₂ (25–40%)</text>
  </g>

  <rect x="30" y="160" width="900" height="42" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="480" y="186" text-anchor="middle" fill="#92400e" font-size="11.5" font-weight="700">
    Метаногенные археи замыкают цепь очистки высококонцентрированных стоков пищевых заводов (снижение ХПК на 85–95%)!
  </text>
</svg>
