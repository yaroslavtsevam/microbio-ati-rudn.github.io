<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 218" width="100%" height="auto" style="background:transparent; font-family:'IBM Plex Sans', -apple-system, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- Box 1: Genomes -->
  <g transform="translate(40, 15)">
    <rect x="0" y="0" width="260" height="114" rx="4" fill="#edf5ff" stroke="#0f62fe" stroke-width="1.8"/>
    <text x="15" y="25" fill="#0043ce" font-size="12" font-weight="700">1. СРАВНИВАЕМЫЕ ГЕНОМЫ (WGS)</text>
    <text x="15" y="48" fill="#0f172a" font-size="11.5" font-weight="500">Геном А: заводской изолят</text>
    <text x="15" y="68" fill="#0f172a" font-size="11.5" font-weight="500">Геном Б: типовой музейный штамм</text>
    <text x="15" y="92" fill="#334155" font-size="10.5">Нарезка генома А на отрезки по 1020 п.н.</text>
  </g>

  <line x1="300" y1="72" x2="340" y2="72" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Box 2: BLAST Alignment -->
  <g transform="translate(350, 15)">
    <rect x="0" y="0" width="280" height="114" rx="4" fill="#f0fdfa" stroke="#007d79" stroke-width="1.8"/>
    <text x="15" y="25" fill="#005d5d" font-size="12" font-weight="700">2. ПАРНОЕ ВЫРАВНИВАНИЕ (BLASTN)</text>
    <text x="15" y="48" fill="#0f172a" font-size="11.5" font-weight="500">Поиск двусторонних ортологов (BBH):</text>
    <text x="15" y="68" fill="#334155" font-size="11">• Сходство отрезка &gt; 70%</text>
    <text x="15" y="88" fill="#334155" font-size="11">• Покрытие длины не менее 70%</text>
  </g>

  <line x1="630" y1="72" x2="670" y2="72" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Box 3: ANI Score & Decision -->
  <g transform="translate(680, 15)">
    <rect x="0" y="0" width="240" height="114" rx="4" fill="#f5f3ff" stroke="#6929c4" stroke-width="1.8"/>
    <text x="15" y="25" fill="#6929c4" font-size="12" font-weight="700">3. ПОРОГ ДЕМАРКАЦИИ ВИДА</text>
    <text x="15" y="50" fill="#047857" font-size="12.5" font-weight="700">ANI ≥ 95–96%</text>
    <text x="15" y="68" fill="#0f172a" font-size="11">Один биологический вид</text>
    <text x="15" y="90" fill="#a2191f" font-size="11.5" font-weight="600">ANI &lt; 95% — разные виды</text>
  </g>

  <!-- Formula -->
  <rect x="40" y="145" width="880" height="58" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="480" y="170" text-anchor="middle" fill="#92400e" font-family="'IBM Plex Mono', monospace" font-size="13" font-weight="700">
    ANI = (Σ % идентичности всех общих ортологов) / N
  </text>
  <text x="480" y="191" text-anchor="middle" fill="#0f172a" font-size="11.5">
    Строгая математическая корреляция с классическим эмпирическим критерием гибридизации DDH ≥ 70%
  </text>
</svg>
