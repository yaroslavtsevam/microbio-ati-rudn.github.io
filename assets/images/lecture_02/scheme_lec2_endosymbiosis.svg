<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 250" width="100%" height="auto" style="background:transparent; font-family:'IBM Plex Sans', -apple-system, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- Left: Host & Cyanobacteria -->
  <g transform="translate(50, 15)">
    <rect x="0" y="0" width="380" height="120" rx="4" fill="#f0fdfa" stroke="#007d79" stroke-width="1.8"/>
    <text x="16" y="26" fill="#005d5d" font-size="12.5" font-weight="700">ПЕРВИЧНЫЙ ЭНДОСИМБИОЗ (~1,6 млрд лет назад)</text>
    <text x="16" y="50" fill="#0f172a" font-size="11.5">Древняя эукариотическая клетка поглотила</text>
    <text x="16" y="69" fill="#047857" font-size="11.5" font-weight="700">фототрофную цианобактерию (Cyanobacteria)</text>
    <text x="16" y="90" fill="#1e293b" font-size="11.5">Цианобактерия превратилась в ХЛОРОПЛАСТ</text>
    <text x="16" y="108" fill="#475569" font-size="10.5">(сохранил 70S рибосомы, кольцевую ДНК и тилакоиды)</text>
  </g>

  <line x1="430" y1="75" x2="490" y2="75" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Right: 3 Lineages of Archaeplastida -->
  <g transform="translate(500, 15)">
    <rect x="0" y="0" width="410" height="120" rx="4" fill="#f5f3ff" stroke="#6929c4" stroke-width="1.8"/>
    <text x="16" y="26" fill="#6929c4" font-size="12.5" font-weight="700">ДИВЕРГЕНЦИЯ СУПЕРГРУППЫ ARCHAEPLASTIDA</text>
    <text x="16" y="52" fill="#047857" font-size="11" font-weight="600">1. Зеленые водоросли (Chlorophyta) → Хлорелла, Дуналиелла</text>
    <text x="16" y="74" fill="#9f1853" font-size="11" font-weight="600">2. Красные водоросли (Rhodophyta) → Агар E406, каррагинан E407</text>
    <text x="16" y="96" fill="#005d5d" font-size="11" font-weight="600">3. Глаукофиты (Glaucophyta) → Сохранили муреин в хлоропласте!</text>
  </g>

  <rect x="50" y="152" width="860" height="84" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="480" y="176" text-anchor="middle" fill="#92400e" font-size="12.5" font-weight="700">
    ПАРАДОКС: «ВОДОРОСЛИ» — ЭТО НЕ СИСТЕМАТИЧЕСКИЙ ТАКСОН, А ЭКОЛОГИЧЕСКОЕ ПОНЯТИЕ!
  </text>
  <text x="480" y="198" text-anchor="middle" fill="#0f172a" font-size="11.5">
    Спирулина (Arthrospira) — прокариот (домен Bacteria, цианобактерия, тонкая стенка из муреина, белок до 65%).
  </text>
  <text x="480" y="218" text-anchor="middle" fill="#0f172a" font-size="11.5">
    Хлорелла (Chlorella) — эукариот (домен Eukarya, ядро, панцирь из алгаенана, требует дезинтеграции).
  </text>
</svg>
