<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 355" width="100%" height="auto" style="background:transparent; font-family:'IBM Plex Sans', -apple-system, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- Step 1: Stress factors -->
  <g transform="translate(60, 12)">
    <rect x="0" y="0" width="840" height="56" rx="4" fill="#fff1f2" stroke="#da1e28" stroke-width="1.8"/>
    <text x="20" y="24" fill="#a2191f" font-size="12.5" font-weight="700">ТЕХНОЛОГИЧЕСКИЙ СТРЕСС В ПИЩЕВОМ ЦЕХЕ:</text>
    <text x="20" y="44" fill="#0f172a" font-size="11.5">Шоковое охлаждение (+2…+4 °C) • Дезинфектанты (хлор, ЧАС) • Низкая активность воды a<tspan baseline-shift="sub" font-size="9">w</tspan> &lt; 0,60 • Высокая кислотность (pH &lt; 4,5)</text>
  </g>

  <line x1="480" y1="68" x2="480" y2="98" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Step 2: Biological adaptations -->
  <g transform="translate(60, 102)">
    <rect x="0" y="0" width="840" height="96" rx="4" fill="#edf5ff" stroke="#0f62fe" stroke-width="1.8"/>
    <text x="20" y="24" fill="#0043ce" font-size="13" font-weight="700">ЦИТОЛОГИЧЕСКИЙ ОТВЕТ КЛЕТКИ (ПЕРЕХОД В VBNC):</text>
    <text x="20" y="46" fill="#0f172a" font-size="12">1. Дварфизм: палочка сжимается в мелкий кокк (объем клетки уменьшается в 2–4 раза)</text>
    <text x="20" y="65" fill="#0f172a" font-size="12">2. Уплотнение стенки: двукратный рост поперечных сшивок пептидогликана</text>
    <text x="20" y="84" fill="#0f172a" font-size="12">3. Мембрана: синтез циклопропановых жирных кислот; метаболический шатдаун (транскрипция &lt; 2%) при сохранении пула АТФ</text>
  </g>

  <!-- Branches -->
  <path d="M 320 198 L 320 238" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M 640 198 L 640 238" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Branch Left: Routine analysis failure -->
  <g transform="translate(60, 242)">
    <rect x="0" y="0" width="400" height="98" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="1.8"/>
    <text x="16" y="24" fill="#92400e" font-size="12" font-weight="700">АНАЛИЗ ПО ГОСТ / ТР ТС 021 (ЧАШКИ ПЕТРИ):</text>
    <text x="16" y="45" fill="#0f172a" font-size="12">• Высев на селективный агар: 0 колоний!</text>
    <text x="16" y="64" fill="#a2191f" font-size="12" font-weight="600">• Заключение: «Брак отсутствует, партия годна»</text>
    <text x="16" y="84" fill="#92400e" font-size="11.5" font-weight="700">[ЛОЖНОЕ СПОКОЙСТВИЕ И СКРЫТЫЙ РИСК]</text>
  </g>

  <!-- Branch Right: Human infection -->
  <g transform="translate(500, 242)">
    <rect x="0" y="0" width="400" height="98" rx="4" fill="#fff1f2" stroke="#da1e28" stroke-width="1.8"/>
    <text x="16" y="24" fill="#a2191f" font-size="12" font-weight="700">ПОПАДАНИЕ В ЖКТ ЧЕЛОВЕКА (+37 °C):</text>
    <text x="16" y="45" fill="#0f172a" font-size="12">• Реверсия (Resuscitation) за 2–4 часа под действием желчи</text>
    <text x="16" y="64" fill="#0f172a" font-size="12">• Восстановление жгутиков и экспрессия энтеротоксинов</text>
    <text x="16" y="84" fill="#da1e28" font-size="11.5" font-weight="700">[ВСПЫШКА ТОКСИКОИНФЕКЦИИ И ЛИСТЕРИОЗА]</text>
  </g>
</svg>
