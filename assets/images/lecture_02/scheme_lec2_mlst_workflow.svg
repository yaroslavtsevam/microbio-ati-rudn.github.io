<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 215" width="100%" height="auto" style="background:transparent; font-family:'IBM Plex Sans', -apple-system, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- Step 1 -->
  <g transform="translate(40, 15)">
    <rect x="0" y="0" width="240" height="122" rx="4" fill="#edf5ff" stroke="#0f62fe" stroke-width="1.8"/>
    <text x="14" y="25" fill="#0043ce" font-size="12" font-weight="700">1. ГЕНЫ ДОМАШНЕГО ХОЗЯЙСТВА</text>
    <text x="14" y="46" fill="#334155" font-size="11">Выбор 7 консервативных генов:</text>
    <text x="14" y="65" fill="#0f172a" font-size="11" font-weight="500">• recA (репарация ДНК)</text>
    <text x="14" y="83" fill="#0f172a" font-size="11" font-weight="500">• gyrB (ДНК-гираза), rpoB (РНК-пол)</text>
    <text x="14" y="101" fill="#0f172a" font-size="11" font-weight="500">• atpD, groEL, gapA, purA</text>
  </g>

  <line x1="280" y1="76" x2="320" y2="76" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Step 2 -->
  <g transform="translate(330, 15)">
    <rect x="0" y="0" width="260" height="122" rx="4" fill="#f0fdfa" stroke="#007d79" stroke-width="1.8"/>
    <text x="14" y="25" fill="#005d5d" font-size="12" font-weight="700">2. ПЦР И СЕКВЕНИРОВАНИЕ</text>
    <text x="14" y="46" fill="#334155" font-size="11">Секвенирование по Сэнгеру / WGS:</text>
    <text x="14" y="66" fill="#0f172a" font-size="11" font-weight="600">Длина фрагментов: 450–500 п.н.</text>
    <text x="14" y="88" fill="#334155" font-size="10.5">Быстрые синонимичные замены</text>
    <text x="14" y="104" fill="#334155" font-size="10.5">в 3-х позициях кодонов</text>
  </g>

  <line x1="590" y1="76" x2="630" y2="76" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Step 3 -->
  <g transform="translate(640, 15)">
    <rect x="0" y="0" width="280" height="122" rx="4" fill="#f5f3ff" stroke="#6929c4" stroke-width="1.8"/>
    <text x="15" y="25" fill="#6929c4" font-size="12" font-weight="700">3. АЛЛЕЛЬНЫЙ ПРОФИЛЬ (ST)</text>
    <text x="15" y="46" fill="#334155" font-size="11">Сопоставление с базой PubMLST:</text>
    <text x="15" y="67" fill="#92400e" font-family="'IBM Plex Mono', monospace" font-size="11.5" font-weight="700">3 - 12 - 1 - 4 - 2 - 8 - 5</text>
    <text x="15" y="90" fill="#047857" font-size="12" font-weight="700">ИТОГ: Сиквенс-тип ST-131</text>
    <text x="15" y="108" fill="#334155" font-size="10.5">(юридическое расследование вспышки)</text>
  </g>

  <!-- Bottom note -->
  <rect x="40" y="154" width="880" height="44" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="480" y="181" text-anchor="middle" fill="#0f172a" font-size="12" font-weight="600">
    Надежно дифференцирует E. coli vs Shigella и B. cereus vs B. anthracis, у которых 16S рРНК идентична на &gt; 99,5%!
  </text>
</svg>
