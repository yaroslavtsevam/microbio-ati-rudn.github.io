<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 415" width="100%" height="auto" style="background:transparent; font-family:'IBM Plex Sans', -apple-system, sans-serif;">
  <defs>
    <linearGradient id="gradBact" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f62fe"/><stop offset="100%" stop-color="#002d9c"/>
    </linearGradient>
    <linearGradient id="gradArch" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d02670"/><stop offset="100%" stop-color="#9f1853"/>
    </linearGradient>
    <linearGradient id="gradEuk" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#007d79"/><stop offset="100%" stop-color="#004144"/>
    </linearGradient>
  </defs>

  <!-- Tree paths -->
  <!-- LUCA at (480, 355) -->
  <path d="M 480 355 L 480 275" stroke="#0f172a" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Left branch to Bacteria -->
  <path d="M 480 275 C 400 275, 200 235, 200 125" stroke="#0f62fe" stroke-width="4" fill="none"/>
  
  <!-- Right branch to Archaea / Eukarya common trunk -->
  <path d="M 480 275 C 560 275, 680 235, 680 185" stroke="#d02670" stroke-width="4" fill="none"/>
  
  <!-- Archaea branch -->
  <path d="M 680 185 C 620 165, 560 135, 560 125" stroke="#d02670" stroke-width="3.5" fill="none"/>
  
  <!-- Eukarya branch from Asgardarchaeota node -->
  <path d="M 680 185 C 740 165, 800 135, 800 125" stroke="#007d79" stroke-width="3.5" fill="none"/>

  <!-- LUCA Callout -->
  <circle cx="480" cy="355" r="10" fill="#d97706" stroke="#0f172a" stroke-width="2"/>
  <rect x="350" y="370" width="260" height="34" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="480" y="392" text-anchor="middle" fill="#92400e" font-size="12.5" font-weight="700">LUCA (~3,8–4,0 млрд лет назад)</text>

  <!-- Domain 1: Bacteria -->
  <g transform="translate(80, 15)">
    <rect x="0" y="0" width="240" height="110" rx="4" fill="url(#gradBact)" stroke="#0043ce" stroke-width="1.5"/>
    <text x="120" y="28" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">ДОМЕН BACTERIA</text>
    <text x="120" y="46" text-anchor="middle" fill="#d0e2ff" font-size="11">Истинные бактерии (муреин)</text>
    <line x1="20" y1="56" x2="220" y2="56" stroke="#78a9ff" stroke-width="1"/>
    <text x="20" y="74" fill="#ffffff" font-size="11">• Pseudomonadota (Proteo)</text>
    <text x="20" y="90" fill="#ffffff" font-size="11">• Bacillota (Firmicutes: LAB, Spores)</text>
    <text x="20" y="104" fill="#ffffff" font-size="11">• Actinomycetota (Bifidobacterium)</text>
  </g>

  <!-- Domain 2: Archaea -->
  <g transform="translate(440, 15)">
    <rect x="0" y="0" width="240" height="110" rx="4" fill="url(#gradArch)" stroke="#9f1853" stroke-width="1.5"/>
    <text x="120" y="28" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">ДОМЕН ARCHAEA</text>
    <text x="120" y="46" text-anchor="middle" fill="#ffd6e8" font-size="11">Простая эфирная связь, S-слой</text>
    <line x1="20" y1="56" x2="220" y2="56" stroke="#ff7eb6" stroke-width="1"/>
    <text x="20" y="74" fill="#ffffff" font-size="11">• Methanobacteriota (Метан)</text>
    <text x="20" y="90" fill="#ffffff" font-size="11">• Halobacteria (Солеварни 25% NaCl)</text>
    <text x="20" y="104" fill="#ffffff" font-size="11">• Asgardarchaeota (Предки эукариот)</text>
  </g>

  <!-- Domain 3: Eukarya -->
  <g transform="translate(700, 15)">
    <rect x="0" y="0" width="220" height="110" rx="4" fill="url(#gradEuk)" stroke="#005d5d" stroke-width="1.5"/>
    <text x="110" y="28" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">ДОМЕН EUKARYA</text>
    <text x="110" y="46" text-anchor="middle" fill="#9ef0f0" font-size="11">Ядро, митохондрии, 80S рибосомы</text>
    <line x1="20" y1="56" x2="200" y2="56" stroke="#3ddbd9" stroke-width="1"/>
    <text x="20" y="74" fill="#ffffff" font-size="11">• Грибы (Дрожжи и Плесени)</text>
    <text x="20" y="90" fill="#ffffff" font-size="11">• Archaeplastida (Водоросли)</text>
    <text x="20" y="104" fill="#ffffff" font-size="11">• Протисты и Животные</text>
  </g>

  <!-- Symbiogenesis arrow from Bacteria to Eukarya -->
  <path d="M 320 95 C 400 185, 650 185, 760 125" stroke="#059669" stroke-width="2.5" stroke-dasharray="6,4" fill="none"/>
  <rect x="330" y="158" width="290" height="26" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="1.2"/>
  <text x="475" y="175" text-anchor="middle" fill="#065f46" font-size="11" font-weight="600">Эндосимбиоз: Митохондрии и Хлоропласты</text>
</svg>
